<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grd-title grd-desc">
    <title id="grd-title">How the github-runner image is built, used and kept current</title>
    <desc id="grd-desc">The Dockerfile adds libatomic1 and GitHub CLI 2.103.3 to actions-runner 2.338.2. The image workflow builds it, checks both additions, and, when release-please creates a release, publishes ghcr.io/tada5hi/github-runner with the runner version as tag. A gha-runner-scale-set uses that tag on the runner and init-dind-externals containers. Each actions/runner release starts a 30-day window: Dependabot opens a pull request for the FROM line, merging it and then the release pull request publishes the new tag, and you update the tag in your deployment. After day 30 GitHub stops queuing jobs and they stay queued. A critical security update can stop queuing without that window.</desc>

    <style>
        :root {
            --fg: #1F2328;
            --muted: #5B6470;
            --panel: #F7F7F4;
            --panel-edge: #D8D8D0;
            --card: #FFFFFF;
            --rail: #8B98A9;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #F0F6FC;
                --muted: #A0A8B4;
                --panel: #17191D;
                --panel-edge: #3E434B;
                --card: #0D1117;
                --rail: #717C8B;
            }
        }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--fg); }
        .muted { fill: var(--muted); }
        .code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
        .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
        .title { font-size: 14px; font-weight: 600; }
        .sub { font-size: 12px; fill: var(--muted); }
        .panel { fill: var(--panel); stroke: var(--panel-edge); }
        .card { fill: var(--card); }
        .rail { stroke: var(--rail); }
        .chip { fill: var(--panel); stroke: var(--panel-edge); }
    </style>

    <defs>
        <marker id="grd-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#8B98A9"/>
        </marker>
    </defs>

    <!-- Dockerfile: layers, the base at the bottom -->
    <rect class="panel" x="16" y="16" width="280" height="280" rx="18"/>
    <text class="label" x="36" y="44">Dockerfile</text>

    <rect class="card" x="36" y="60" width="240" height="66" rx="12" stroke="#D97706" stroke-width="1.5"/>
    <text class="title" x="54" y="88">GitHub CLI 2.103.3</text>
    <text class="sub" x="54" y="109">tarball, sha256 pinned</text>

    <rect class="card" x="36" y="136" width="240" height="66" rx="12" stroke="#D97706" stroke-width="1.5"/>
    <text class="title" x="54" y="164">libatomic1</text>
    <text class="sub" x="54" y="185">apt-get, Node 26 needs it</text>

    <rect class="card" x="36" y="212" width="240" height="66" rx="12" stroke="#64748B" stroke-width="1.5"/>
    <text class="title code" x="54" y="240">actions-runner:2.338.2</text>
    <text class="sub" x="54" y="261">the FROM line, sets the tag</text>

    <path class="rail" d="M296 156 H334" stroke-width="2" marker-end="url(#grd-head)"/>

    <!-- image.yml -->
    <rect class="panel" x="336" y="16" width="280" height="280" rx="18"/>
    <text class="label" x="356" y="44">image.yml, GitHub-hosted</text>

    <rect class="card" x="356" y="60" width="240" height="66" rx="12" stroke="#64748B" stroke-width="1.5"/>
    <text class="title" x="374" y="88">Build</text>
    <text class="sub code" x="374" y="109">docker build</text>

    <rect class="card" x="356" y="136" width="240" height="66" rx="12" stroke="#64748B" stroke-width="1.5"/>
    <text class="title" x="374" y="164">Check the additions</text>
    <text class="sub code" x="374" y="185">gh, libatomic.so.1</text>

    <rect class="card" x="356" y="212" width="240" height="66" rx="12" stroke="#0D9488" stroke-width="1.5"/>
    <text class="title" x="374" y="240">Publish</text>
    <text class="sub" x="374" y="261">craneship, only for a release</text>

    <path class="rail" d="M616 156 H654" stroke-width="2" marker-end="url(#grd-head)"/>

    <!-- the deployment -->
    <rect class="panel" x="656" y="16" width="288" height="280" rx="18"/>
    <text class="label" x="676" y="44">Your scale set</text>

    <rect class="card" x="676" y="60" width="248" height="66" rx="12" stroke="#0D9488" stroke-width="1.5"/>
    <text class="title code" x="694" y="88">github-runner:2.338.2</text>
    <text class="sub code" x="694" y="109">ghcr.io/tada5hi, amd64</text>

    <path class="rail" d="M800 126 V146" stroke-width="2" marker-end="url(#grd-head)"/>

    <rect class="card" x="676" y="148" width="248" height="130" rx="12" stroke="#64748B" stroke-width="1.5"/>
    <text class="title" x="694" y="175">template.spec</text>
    <text class="sub" x="694" y="196">the tag goes in both containers</text>
    <rect class="chip" x="694" y="208" width="212" height="26" rx="8"/>
    <text class="code" x="706" y="225" font-size="12">runner</text>
    <rect class="chip" x="694" y="240" width="212" height="26" rx="8"/>
    <text class="code" x="706" y="257" font-size="12">init-dind-externals</text>

    <!-- the 30-day loop, drawn as the window it has to finish in -->
    <rect class="panel" x="16" y="332" width="928" height="128" rx="18"/>
    <text class="label" x="36" y="358">The 30-day bump loop</text>

    <path class="rail" d="M245 374 V298" stroke-width="2" marker-end="url(#grd-head)"/>
    <path class="rail" d="M399 374 V298" stroke-width="2" marker-end="url(#grd-head)"/>
    <path class="rail" d="M715 374 V298" stroke-width="2" marker-end="url(#grd-head)"/>

    <path class="rail" d="M166 408 H178" stroke-width="2" marker-end="url(#grd-head)"/>
    <path class="rail" d="M310 408 H322" stroke-width="2" marker-end="url(#grd-head)"/>
    <path class="rail" d="M474 408 H638" stroke-width="2" marker-end="url(#grd-head)"/>
    <rect class="chip" x="508" y="398" width="96" height="20" rx="10"/>
    <text class="code" x="556" y="412" font-size="11" text-anchor="middle">new tag</text>

    <rect class="card" x="36" y="374" width="130" height="68" rx="12" stroke="#64748B" stroke-width="1.5"/>
    <text class="title" x="50" y="402">Day 0</text>
    <text class="sub" x="50" y="423">runner release</text>

    <rect class="card" x="180" y="374" width="130" height="68" rx="12" stroke="#D97706" stroke-width="1.5"/>
    <text class="title" x="194" y="402">Dependabot</text>
    <text class="sub" x="194" y="423">FROM pull request</text>

    <rect class="card" x="324" y="374" width="150" height="68" rx="12" stroke="#0D9488" stroke-width="1.5"/>
    <text class="title" x="338" y="402">Merge</text>
    <text class="sub" x="338" y="423">then release PR</text>

    <rect class="card" x="640" y="374" width="150" height="68" rx="12" stroke="#0D9488" stroke-width="1.5"/>
    <text class="title" x="654" y="402">Update the tag</text>
    <text class="sub" x="654" y="423">in your deployment</text>

    <rect class="card" x="804" y="374" width="120" height="68" rx="12" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="title" x="818" y="402">After day 30</text>
    <text class="sub" x="818" y="423">jobs stay queued</text>

    <!-- one bump travels the loop once and disappears -->
    <g opacity="0">
        <circle r="9" fill="#D97706" fill-opacity="0.25"/>
        <circle r="4.5" fill="#D97706"/>
        <animateMotion dur="4s" repeatCount="1" fill="freeze" path="M166 408 H640"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4s" repeatCount="1" fill="freeze"/>
    </g>

    <!-- what the window does not cover -->
    <rect class="panel" x="16" y="478" width="928" height="44" rx="14" stroke-dasharray="5 5"/>
    <text class="muted" x="36" y="505" font-size="13">A critical security update of the runner stops queuing until you have updated, without the 30 days.</text>
</svg>
